name: Native iOS simulator preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and capture every screen
        run: |
          set -euo pipefail
          xcodebuild -project Between.xcodeproj -target Between -configuration Debug -sdk iphonesimulator CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/between-build" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" || { cat "$RUNNER_TEMP/build.log"; exit 1; }
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --dataNetwork wifi --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/between-build/Between.app"
          for screen in home profile write comments reply more detail; do
            ARGS="-preview-fixture -ui-zh"
            if [ "$screen" != "home" ]; then ARGS="$ARGS -ui-$screen"; fi
            xcrun simctl launch "$DEVICE" com.example.between.preview $ARGS
            sleep 9
            xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/native-$screen.png"
            xcrun simctl terminate "$DEVICE" com.example.between.preview || true
            sleep 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-preview
          path: ${{ runner.temp }}/native-*.png
          retention-days: 1
